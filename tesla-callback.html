<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sonic · Código de Tesla</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #0b1a12; color: #f2f2f2; padding: 20px; }
  .card { width: 100%; max-width: 520px; background: #12261b; border: 1px solid #2e5c40;
          border-radius: 18px; padding: 26px 22px; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 6px; color: #d9b44a; }
  p { font-size: 1.05rem; line-height: 1.45; margin: 10px 0; }
  .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.6rem; font-weight: 700;
          word-break: break-all; background: #06100b; border: 2px dashed #d9b44a; border-radius: 12px;
          padding: 18px 12px; margin: 18px 0; user-select: all; }
  button { font-size: 1.25rem; font-weight: 700; padding: 14px 34px; border: 0; border-radius: 12px;
           background: #2fbf6b; color: #04170c; cursor: pointer; width: 100%; }
  button:active { transform: scale(0.98); }
  .ok { color: #2fbf6b; font-weight: 700; min-height: 1.4em; }
  .err { color: #ff7a7a; }
  .small { font-size: 0.9rem; color: #a9bfb2; }
</style>
</head>
<body>
<main class="card">
  <h1>⚡ Sonic · Conexión con Tesla</h1>
  <div id="okbox" hidden>
    <p>¡Listo! Este es tu código:</p>
    <div class="code" id="code"></div>
    <button id="copy" type="button">Copiar</button>
    <p class="ok" id="msg"></p>
    <p><strong>Pega este código en el chat de Tesla (tu asistente).</strong></p>
    <p class="small">El código caduca en pocos minutos. Si tarda mucho, vuelve a empezar.</p>
  </div>
  <div id="errbox" hidden>
    <p class="err" id="errmsg">No he encontrado ningún código en esta página.</p>
    <p>Vuelve al chat y dile a tu asistente que no ha salido el código.</p>
  </div>
</main>
<script>
  (function () {
    var q = new URLSearchParams(window.location.search);
    var code = q.get("code");
    var err = q.get("error");
    if (code) {
      document.getElementById("code").textContent = code;
      document.getElementById("okbox").hidden = false;
      document.getElementById("copy").addEventListener("click", function () {
        var msg = document.getElementById("msg");
        var done = function () { msg.textContent = "✅ Copiado"; };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(code).then(done, fallback);
        } else { fallback(); }
        function fallback() {
          var r = document.createRange();
          r.selectNodeContents(document.getElementById("code"));
          var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
          try { document.execCommand("copy"); done(); }
          catch (e) { msg.textContent = "Mantén pulsado el código para copiarlo"; }
        }
      });
    } else {
      if (err) {
        document.getElementById("errmsg").textContent =
          "Tesla ha devuelto un error: " + err + ". No pasa nada, lo repetimos.";
      }
      document.getElementById("errbox").hidden = false;
    }
  })();
</script>
</body>
</html>
